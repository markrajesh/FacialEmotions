version: 1
service: facial-emotion-analysis
summary: Local analysis contract for image, video, and webcam emotion processing.
operations:
  analyze_image:
    request:
      input_mode: image
      supported_formats: [jpeg, png, bmp]
      fields:
        source_path: string
        enable_genuineness_check: boolean
        max_faces: integer
    response:
      result_type: analysis_session
      single_frame: true
  analyze_video:
    request:
      input_mode: video
      supported_formats: [mp4, avi, mov]
      fields:
        source_path: string
        enable_genuineness_check: boolean
        sampling_rate_fps: number
        max_faces: integer
    response:
      result_type: analysis_session
      single_frame: false
      includes_timestamps: true
  analyze_webcam_frame:
    request:
      input_mode: webcam
      supported_formats: [live]
      fields:
        stream_id: string
        enable_genuineness_check: boolean
        sampling_rate_fps: number
        max_faces: integer
    response:
      result_type: frame_analysis
      streaming: true
schemas:
  face_detection:
    type: object
    required: [face_id, bbox, detection_confidence]
    properties:
      face_id:
        type: string
      bbox:
        type: array
        items:
          type: integer
        minItems: 4
        maxItems: 4
      detection_confidence:
        type: number
        minimum: 0
        maximum: 1
  emotion_prediction:
    type: object
    required: [face_id, emotion_label, confidence]
    properties:
      face_id:
        type: string
      emotion_label:
        type: string
        enum: [happiness, sadness, anger, surprise, fear, disgust, neutral]
      confidence:
        type: number
        minimum: 0
        maximum: 1
  genuineness_assessment:
    type: object
    required: [face_id, predicted_state, confidence]
    properties:
      face_id:
        type: string
      predicted_state:
        type: string
        enum: [genuine, posed, uncertain]
      confidence:
        type: number
        minimum: 0
        maximum: 1
      reasoning_flags:
        type: array
        items:
          type: string
  frame_analysis:
    type: object
    required: [timestamp_ms, faces, emotions, genuineness]
    properties:
      timestamp_ms:
        type: integer
        minimum: 0
      faces:
        type: array
        items:
          $ref: '#/schemas/face_detection'
      emotions:
        type: array
        items:
          $ref: '#/schemas/emotion_prediction'
      genuineness:
        type: array
        items:
          $ref: '#/schemas/genuineness_assessment'
  analysis_session:
    type: object
    required: [request_id, input_mode, analyzed_frames, summary_counts]
    properties:
      request_id:
        type: string
      input_mode:
        type: string
        enum: [image, video, webcam]
      analyzed_frames:
        type: array
        items:
          $ref: '#/schemas/frame_analysis'
      summary_counts:
        type: object
        additionalProperties:
          type: integer
